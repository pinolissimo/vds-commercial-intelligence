name: VDS Opportunity-First Dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/opportunity_first_dispatcher.py'
      - 'scripts/first_party_route_enricher.py'
      - 'views/opportunity-first-optimizer.json'
      - 'views/public-web-enriched-routes.json'
      - '.github/workflows/opportunity-first-dispatcher.yml'
      - 'governance/opportunity-first-dispatch-kick.json'

permissions:
  contents: write

concurrency:
  group: vds-global-first-contact-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HOSTINGER_EMAIL_API_TOKEN: ${{ secrets.HOSTINGER_EMAIL_API_TOKEN }}
      HOSTINGER_MAILBOX: info@visualdesignstudio.es
      VDS_SMTP_HOST: ${{ secrets.VDS_SMTP_HOST }}
      VDS_SMTP_PORT: ${{ secrets.VDS_SMTP_PORT }}
      VDS_SMTP_USER: ${{ secrets.VDS_SMTP_USER }}
      VDS_SMTP_PASSWORD: ${{ secrets.VDS_SMTP_PASSWORD }}
      VDS_SMTP_FROM: ${{ secrets.VDS_SMTP_FROM }}
      VDS_OWNER_BCC: allocca.pino@gmail.com
      VDS_DISPATCH_MAX_BATCH: '25'
      VDS_DISPATCH_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile dispatcher and safety layer
        run: |
          python3 -m py_compile scripts/opportunity_first_dispatcher.py scripts/sync_hostinger_mail.py scripts/global_contact_ledger.py scripts/revenue_flow_preflight.py

      - name: Enforce Madrid send window
        id: window
        shell: bash
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          H=$((10#$H))
          if (( H >= 9 && H < 19 )); then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "SEND_WINDOW_OPEN hour=$H"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "SEND_WINDOW_CLOSED hour=$H"
          fi

      - name: Pre-send provider synchronization and fail-closed dedup rebuild
        if: steps.window.outputs.open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_EMAIL_API_TOKEN:-}"
          python3 scripts/sync_hostinger_mail.py
          python3 scripts/global_contact_ledger.py --build
          python3 scripts/revenue_flow_preflight.py --repair

      - name: Build bounded verified READY_TO_SEND batch
        if: steps.window.outputs.open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/opportunity_first_dispatcher.py

      - name: Refresh dedup after READY_TO_SEND build
        if: steps.window.outputs.open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/global_contact_ledger.py --build

      - name: Persist dispatcher and provider truth safely
        if: steps.window.outputs.open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-opportunity-dispatcher"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"
          git add state/opportunity-first-dispatch-latest.json data/opportunity-first-dispatch-runs state/provider-observation.json state/provider-outbound-live.json state/provider-inbound-live.json state/provider-sync-status.json data/global-sent-email-ledger.jsonl views/provider-contact-suppression-index.json views/global-sent-email-index.json views/global-organization-index.json views/global-contact-ledger.json
          if git diff --cached --quiet; then
            echo "No dispatcher/provider changes"
            exit 0
          fi
          git commit -m "outreach: persist verified opportunity-first ready queue"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if git rebase origin/main; then
              sleep $((attempt * 2))
              continue
            fi
            git rebase --abort 2>/dev/null || true
            echo "Persistence race: provider sends already occurred; refusing to rerun sender." >&2
            exit 1
          done
          exit 1
