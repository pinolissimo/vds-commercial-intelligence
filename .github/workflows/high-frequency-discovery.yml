name: VDS High-Frequency Discovery Fanout

on:
  schedule:
    # Six chances/hour, staggered away from the top of the hour.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/high-frequency-discovery.yml"
      - "governance/high-frequency-discovery-kick.json"
      # Independent execution flows also kick discovery. This makes a missed GitHub cron
      # non-fatal as long as either active execution flow is running.
      - "state/direct-job-run-*.jsonl"
      - "state/direct-job-ledger.jsonl"
      - "state/revenue-flow-run-*.jsonl"
      - "state/revenue-flow-ledger.jsonl"
      - "scripts/high_frequency_discovery.py"
      - "scripts/supplemental_public_sources.py"
      - "scripts/direct_employer_bulk_sources.py"
      - "scripts/opportunity_semantic_gate.py"
      - "scripts/deepseek_shadow_semantic.py"
      - "scripts/search_source_optimizer.py"
      - "scripts/territory_yield_radar.py"
      - "scripts/territory_radar_guard.py"
      - "scripts/acquisition_performance_optimizer.py"
      - "scripts/search_mission_planner.py"
      - "scripts/multi_engine_query_router.py"
      - "config/high-frequency-discovery-sources.json"
      - "config/supplemental-public-sources.json"
      - "config/direct-employer-bulk-sources.json"
      - "config/multi-engine-search-router.json"
      - "config/semantic-opportunity-policy.json"
      - "config/deepseek-shadow-policy.json"
      - "config/search-territory-frontier.json"
      - "config/adaptive-search-policy.json"
      - "config/territorial-intent-query-playbook.json"

permissions:
  contents: write

concurrency:
  group: vds-high-frequency-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Discovery is deliberately fail-open at the source/enrichment layer. One broken
      # source or optimizer must never stop the other sources or the execution flows.
      - name: Run core public-source fanout
        continue-on-error: true
        run: python scripts/high_frequency_discovery.py

      - name: Merge supplemental rate-aware public sources
        continue-on-error: true
        run: python scripts/supplemental_public_sources.py

      - name: Merge employer-direct and expanded remote bulk sources
        continue-on-error: true
        run: python scripts/direct_employer_bulk_sources.py

      - name: Apply semantic role geo freshness gate
        continue-on-error: true
        run: python scripts/opportunity_semantic_gate.py

      - name: DeepSeek semantic shadow evaluation
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/deepseek_shadow_semantic.py

      - name: Rank source performance
        continue-on-error: true
        run: python scripts/search_source_optimizer.py

      - name: Update territory yield radar
        continue-on-error: true
        run: python scripts/territory_yield_radar.py

      - name: Guard unresolved territories and build enrichment queue
        continue-on-error: true
        run: python scripts/territory_radar_guard.py

      - name: Optimize downstream acquisition capacity
        continue-on-error: true
        run: python scripts/acquisition_performance_optimizer.py

      - name: Build territorial high-intent search missions
        continue-on-error: true
        run: python scripts/search_mission_planner.py

      - name: Build multi-engine query fanout missions
        continue-on-error: true
        run: python scripts/multi_engine_query_router.py

      - name: Commit discovery-owned state safely
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VDS_RUN_ID: ${{ github.run_id }}
          VDS_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "vds-discovery-bot"
          git config user.email "actions@users.noreply.github.com"

          # Single-writer boundary: this workflow commits only discovery-owned artifacts.
          # Cross-signal, human-review and api/v1 remain owned elsewhere.
          run_pipeline_fail_open() {
            python scripts/high_frequency_discovery.py || echo "WARN core discovery failed"
            python scripts/supplemental_public_sources.py || echo "WARN supplemental discovery failed"
            python scripts/direct_employer_bulk_sources.py || echo "WARN employer-direct discovery failed"
            python scripts/opportunity_semantic_gate.py || echo "WARN semantic gate failed; preserve last good seeds"
            python scripts/deepseek_shadow_semantic.py || echo "WARN DeepSeek shadow failed open"
            python scripts/search_source_optimizer.py || echo "WARN source optimizer failed"
            python scripts/territory_yield_radar.py || echo "WARN territory radar failed"
            python scripts/territory_radar_guard.py || echo "WARN territory guard failed"
            python scripts/acquisition_performance_optimizer.py || echo "WARN acquisition optimizer failed"
            python scripts/search_mission_planner.py || echo "WARN mission planner failed"
            python scripts/multi_engine_query_router.py || echo "WARN multi-engine router failed"
          }

          write_heartbeat() {
            mkdir -p metrics
            cat > metrics/runtime-discovery-heartbeat.json <<EOF
          {
            "schema_version": "1.0",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run_id": "${VDS_RUN_ID}",
            "trigger": "${VDS_EVENT}",
            "state": "DISCOVERY_CYCLE_REACHED_PERSISTENCE",
            "policy": "SOURCE_AND_ENRICHMENT_FAILURES_ARE_NON_FATAL; EXECUTION_FLOWS_REMAIN_INDEPENDENT"
          }
          EOF
          }

          stage_state() {
            git add views/high-frequency-discovery-latest.json \
                    views/high-frequency-discovery-qualified-seeds.json \
                    views/deepseek-shadow-latest.json \
                    views/search-source-performance.json \
                    views/territory-yield-radar.json \
                    views/territory-enrichment-queue.json \
                    views/acquisition-performance.json \
                    views/search-mission-plan.json \
                    views/multi-engine-search-missions.json \
                    data/high-frequency-discovery/raw-signals.jsonl \
                    metrics/high-frequency-discovery-state.json \
                    metrics/high-frequency-watch-state.json \
                    metrics/high-frequency-semantic-gate.json \
                    metrics/deepseek-shadow-state.json \
                    metrics/supplemental-public-sources-state.json \
                    metrics/direct-employer-bulk-sources-state.json \
                    metrics/territory-yield-radar-state.json \
                    metrics/runtime-discovery-heartbeat.json \
                    config/adaptive-search-runtime.json \
                    config/acquisition-runtime-command.json
          }

          commit_state() {
            write_heartbeat
            stage_state
            if git diff --cached --quiet; then
              echo "No discovery-owned changes"
              return 1
            fi
            git commit -m "data: refresh discovery-owned intelligence"
          }

          # Persist whatever successful source/enrichment output exists. Do not rerun the
          # whole pipeline unless a same-file race actually forces a rebuild.
          if ! commit_state; then
            exit 0
          fi

          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Discovery state committed on attempt ${attempt}"
              exit 0
            fi

            echo "Concurrent main update detected (attempt ${attempt}); rebasing discovery-only commit"
            git fetch origin main
            if git rebase origin/main; then
              sleep $((attempt + 1))
              continue
            fi

            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            run_pipeline_fail_open
            if ! commit_state; then
              echo "Fresh canonical state already contains equivalent discovery output"
              exit 0
            fi
            sleep $((attempt * 2 + 1))
          done

          echo "Unable to persist discovery state after eight collision-safe attempts" >&2
          exit 1
