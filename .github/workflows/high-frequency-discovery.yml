name: VDS High-Frequency Discovery Fanout

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/high-frequency-discovery.yml"
      - "scripts/high_frequency_discovery.py"
      - "scripts/supplemental_public_sources.py"
      - "scripts/direct_employer_bulk_sources.py"
      - "scripts/opportunity_semantic_gate.py"
      - "scripts/search_source_optimizer.py"
      - "scripts/territory_yield_radar.py"
      - "scripts/territory_radar_guard.py"
      - "scripts/acquisition_performance_optimizer.py"
      - "scripts/search_mission_planner.py"
      - "scripts/multi_engine_query_router.py"
      - "scripts/cross_signal_human_review_reconcile.py"
      - "scripts/merge_human_review_pending.py"
      - "scripts/reconcile_global_contact_history.py"
      - "data/human-review-pending/**"
      - "config/high-frequency-discovery-sources.json"
      - "config/supplemental-public-sources.json"
      - "config/direct-employer-bulk-sources.json"
      - "config/multi-engine-search-router.json"
      - "config/semantic-opportunity-policy.json"
      - "config/search-territory-frontier.json"
      - "config/adaptive-search-policy.json"
      - "config/territorial-intent-query-playbook.json"

permissions:
  contents: write

concurrency:
  group: vds-high-frequency-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run core public-source fanout
        run: python scripts/high_frequency_discovery.py

      - name: Merge supplemental rate-aware public sources
        run: python scripts/supplemental_public_sources.py

      - name: Merge employer-direct and expanded remote bulk sources
        run: python scripts/direct_employer_bulk_sources.py

      - name: Apply semantic role geo freshness gate
        run: python scripts/opportunity_semantic_gate.py

      - name: Rank source performance
        run: python scripts/search_source_optimizer.py

      - name: Update territory yield radar
        run: python scripts/territory_yield_radar.py

      - name: Guard unresolved territories and build enrichment queue
        run: python scripts/territory_radar_guard.py

      - name: Optimize downstream acquisition capacity
        run: python scripts/acquisition_performance_optimizer.py

      - name: Build territorial high-intent search missions
        run: python scripts/search_mission_planner.py

      - name: Build multi-engine query fanout missions
        run: python scripts/multi_engine_query_router.py

      - name: Merge pending high-value human review records
        run: python scripts/merge_human_review_pending.py

      - name: Reconcile cross-signal + high-value human review
        run: python scripts/cross_signal_human_review_reconcile.py

      - name: Reconcile global contacted/owner-stop history
        run: python scripts/reconcile_global_contact_history.py

      - name: Commit discovery and adaptive intelligence state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-discovery-bot"
          git config user.email "actions@users.noreply.github.com"

          run_pipeline() {
            python scripts/high_frequency_discovery.py
            python scripts/supplemental_public_sources.py
            python scripts/direct_employer_bulk_sources.py
            python scripts/opportunity_semantic_gate.py
            python scripts/search_source_optimizer.py
            python scripts/territory_yield_radar.py
            python scripts/territory_radar_guard.py
            python scripts/acquisition_performance_optimizer.py
            python scripts/search_mission_planner.py
            python scripts/multi_engine_query_router.py
            python scripts/merge_human_review_pending.py
            python scripts/cross_signal_human_review_reconcile.py
            python scripts/reconcile_global_contact_history.py
          }

          stage_state() {
            git add views/high-frequency-discovery-latest.json \
                    views/high-frequency-discovery-qualified-seeds.json \
                    views/search-source-performance.json \
                    views/territory-yield-radar.json \
                    views/territory-enrichment-queue.json \
                    views/acquisition-performance.json \
                    views/search-mission-plan.json \
                    views/multi-engine-search-missions.json \
                    views/cross-signal-opportunities.json \
                    views/human-review-high-value.json \
                    data/high-frequency-discovery/raw-signals.jsonl \
                    metrics/high-frequency-discovery-state.json \
                    metrics/high-frequency-watch-state.json \
                    metrics/high-frequency-semantic-gate.json \
                    metrics/supplemental-public-sources-state.json \
                    metrics/direct-employer-bulk-sources-state.json \
                    metrics/territory-yield-radar-state.json \
                    metrics/daily/*-cross-signal.json \
                    config/adaptive-search-runtime.json \
                    config/acquisition-runtime-command.json
          }

          commit_state() {
            stage_state
            if git diff --cached --quiet; then
              echo "No discovery changes"
              return 1
            fi
            git commit -m "data: refresh expanded multi-engine discovery acquisition radar"
          }

          if ! commit_state; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Discovery state committed on attempt ${attempt}"
              exit 0
            fi

            echo "Concurrent main update detected; rebuilding from freshest canonical state (attempt ${attempt})"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            run_pipeline
            if ! commit_state; then
              echo "Fresh canonical state already contains equivalent discovery output"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to commit discovery state after collision-safe retries" >&2
          exit 1
