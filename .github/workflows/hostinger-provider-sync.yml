name: VDS Hostinger Provider Sync

# manual verification trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_hostinger_mail.py'
      - '.github/workflows/hostinger-provider-sync.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: vds-hostinger-provider-sync
  cancel-in-progress: true

jobs:
  sync-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTINGER_EMAIL_API_TOKEN: ${{ secrets.HOSTINGER_EMAIL_API_TOKEN }}
      HOSTINGER_MAILBOX: info@visualdesignstudio.es
      VDS_OWNER_BCC: allocca.pino@gmail.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Hostinger secret
        id: hostinger-secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_EMAIL_API_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOSTINGER_EMAIL_API_TOKEN is not configured yet; automatic provider sync is waiting for one-time setup."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize Hostinger Sent and Inbox
        if: steps.hostinger-secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_hostinger_mail.py
          python3 scripts/sync_hostinger_mail.py

      - name: Commit provider state
        if: steps.hostinger-secret.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-provider-sync-bot"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"

          stage_and_commit() {
            git add state/provider-observation.json state/provider-outbound-live.json state/provider-inbound-live.json state/provider-sync-status.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "provider: sync Hostinger mailbox state"
            return 0
          }

          if ! stage_and_commit; then
            echo "Provider state already current"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; rebuilding provider state on latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/sync_hostinger_mail.py

            if ! stage_and_commit; then
              echo "Provider state became current after refresh"
              exit 0
            fi

            sleep $((attempt * 2))
          done
          exit 1
