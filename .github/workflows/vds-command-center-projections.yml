name: VDS Command Center — Projections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'views/**'
      - 'metrics/**'
      - 'governance/**'
      - 'campaigns/**'
      - 'leads/**'
      - 'outreach/**'
      - 'reports/**'
      - 'runtime/**'
      - 'config/**'
      - 'command-center/commands/**'
      - 'scripts/build_command_center_api.py'
      - '.github/workflows/vds-command-center-projections.yml'

permissions:
  contents: write

concurrency:
  group: vds-command-center-projections
  cancel-in-progress: true

jobs:
  build-read-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build disposable API projections
        run: python3 scripts/build_command_center_api.py

      - name: Commit projection delta only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-command-center-bot"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"
          git add api/v1
          if git diff --cached --quiet; then
            echo "No projection changes"
            exit 0
          fi
          git commit -m "dashboard: refresh command center projections"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another worker; refreshing canonical state (attempt $attempt)"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_command_center_api.py
            git add api/v1
            if git diff --cached --quiet; then
              echo "Latest main already contains equivalent projections"
              exit 0
            fi
            git commit -m "dashboard: refresh command center projections"
            sleep $((attempt * 2))
          done
          echo "Unable to commit projections after retries" >&2
          exit 1
