name: VDS Command Center — Projections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["VDS High-Frequency Discovery Fanout"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'views/**'
      - 'metrics/**'
      - 'governance/**'
      - 'campaigns/**'
      - 'leads/**'
      - 'outreach/**'
      - 'reports/**'
      - 'runtime/**'
      - 'config/**'
      - 'state/provider-observation.json'
      - 'state/provider-outbound-live.json'
      - 'state/provider-outbound-live-pending-*.json'
      - 'state/provider-outbound-live-pending/**'
      - 'state/assistant-outbound-live.json'
      - 'state/assistant-outbound-live-pending-*.json'
      - 'state/assistant-outbound-live-pending/**'
      - 'state/provider-inbound-live.json'
      - 'state/provider-inbound-live-pending-*.json'
      - 'state/provider-inbound-live-pending/**'
      - 'command-center/commands/**'
      - 'scripts/build_command_center_api.py'
      - 'scripts/enrich_command_center_funnel.py'
      - 'scripts/overlay_provider_live_dashboard.py'
      - 'scripts/overlay_provider_live_replies.py'
      - 'scripts/update_command_center_health.py'
      - '.github/workflows/vds-command-center-projections.yml'

permissions:
  contents: write
concurrency:
  group: vds-command-center-projections
  cancel-in-progress: true
jobs:
  build-read-model:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and validate disposable API projections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_command_center_api.py
          python3 scripts/enrich_command_center_funnel.py
          python3 scripts/overlay_provider_live_dashboard.py
          python3 scripts/overlay_provider_live_replies.py
          python3 scripts/update_command_center_health.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('api/v1/health.json').read_text()); t=json.loads(Path('api/v1/today.json').read_text()); d=json.loads(Path('api/v1/dashboard.json').read_text())
          assert h['schema_version']=='2.1'
          assert isinstance(t.get('sent_count'),int) and t['sent_count']>=0
          assert isinstance(t.get('first_contact_count'),int) and t['first_contact_count']>=0
          assert h.get('reconciled_at') and h.get('provider_observed_at')
          assert isinstance(h.get('provider_observation_fresh'),bool)
          assert isinstance(h.get('outbound_reconciled'),bool) and isinstance(h.get('inbound_reconciled'),bool)
          assert (d.get('source_health') or {}).get('provider_observed_at')==h['provider_observed_at']
          PY
      - name: Commit projection delta only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-command-center-bot"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"
          git add api/v1
          if git diff --cached --quiet; then echo "No projection changes"; exit 0; fi
          git commit -m "dashboard: refresh command center projections"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git reset --hard origin/main
            python3 scripts/build_command_center_api.py
            python3 scripts/enrich_command_center_funnel.py
            python3 scripts/overlay_provider_live_dashboard.py
            python3 scripts/overlay_provider_live_replies.py
            python3 scripts/update_command_center_health.py
            git add api/v1
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "dashboard: refresh command center projections"
            sleep $((attempt * 2))
          done
          exit 1
