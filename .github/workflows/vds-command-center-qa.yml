name: VDS Command Center — QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/vds-command-*'
    paths:
      - 'command-center/**'
      - 'api/v1/**'
      - 'project/COMMAND_CENTER_TASK_BRIDGE_PROTOCOL.md'
      - 'scripts/build_command_center_api.py'
      - 'scripts/vds_ai_command.py'
      - 'scripts/prepare_command_center_assets.py'
      - 'scripts/test_command_center.py'
      - '.github/workflows/vds-command-center-*.yml'
      - '.github/workflows/vds-ai-command.yml'

permissions:
  contents: read

concurrency:
  group: vds-command-center-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python syntax
        run: |
          python3 -m py_compile \
            scripts/build_command_center_api.py \
            scripts/vds_ai_command.py \
            scripts/prepare_command_center_assets.py \
            scripts/test_command_center.py

      - name: JavaScript syntax
        run: |
          node --check command-center/assets/app.js
          node --check command-center/assets/sodium-bootstrap.js
          node --check command-center/assets/secure-onboarding.js

      - name: Build read-only projections
        run: python3 scripts/build_command_center_api.py

      - name: Static security and architecture QA
        run: python3 scripts/test_command_center.py

      - name: Validate command bridge schema and routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.vds_ai_command import fallback_targets
          pending=json.loads(Path('command-center/commands/pending.json').read_text())
          processed=json.loads(Path('command-center/commands/processed.json').read_text())
          assert pending['schema_version'] == '1.2'
          assert isinstance(pending['commands'], list)
          assert isinstance(processed['receipts'], list)
          assert fallback_targets('SEND_DIRECTIVE','send_ready_jobs',{}) == ['LINKEDIN_HUNTER']
          assert fallback_targets('SEND_DIRECTIVE','send_ready_commercial',{}) == ['UNIFIED_LOOP']
          assert fallback_targets('SEARCH_DIRECTIVE','agency_white_label',{}) == ['AGENCY_RADAR']
          assert fallback_targets('SEARCH_DIRECTIVE','direct_job_wordpress',{}) == ['LINKEDIN_HUNTER']
          assert fallback_targets('PRIORITY_DIRECTIVE','prioritize_north_italy',{}) == ['AGENCY_RADAR','LINKEDIN_HUNTER','UNIFIED_LOOP']
          text=Path('scripts/vds_ai_command.py').read_text()
          for worker in ('AGENCY_RADAR','LINKEDIN_HUNTER','UNIFIED_LOOP'):
              assert worker in text
          assert 'normal_cycle_must_continue' in text
          assert 'expires_at' in text
          PY

      - name: Test local asset vendoring and secure onboarding injection
        run: |
          rm -rf /tmp/vds-pages
          mkdir -p /tmp/vds-pages
          cp -R command-center/. /tmp/vds-pages/
          python3 scripts/prepare_command_center_assets.py /tmp/vds-pages
          test -s /tmp/vds-pages/assets/fonts/dm-sans.woff2
          test -s /tmp/vds-pages/assets/fonts/material-symbols-rounded.woff2
          test -s /tmp/vds-pages/assets/vendor/chart.umd.min.js
          test -s /tmp/vds-pages/assets/vendor/sodium.js
          grep -q 'assets/secure-onboarding.js' /tmp/vds-pages/index.html
          grep -q 'assets/vendor/sodium.js' /tmp/vds-pages/index.html
          grep -q 'Secrets read/write' /tmp/vds-pages/index.html
          grep -q 'crypto_box_seal' /tmp/vds-pages/assets/secure-onboarding.js
          ! grep -R -E 'sk-[A-Za-z0-9_-]{20,}' /tmp/vds-pages
          ! grep -R 'localStorage' /tmp/vds-pages/assets/*.js

      - name: Runtime LibSodium browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vds-pages/crypto-smoke.html <<'EOF'
          <!doctype html><meta charset="utf-8"><body>BOOT
          <script src="assets/sodium-bootstrap.js"></script>
          <script src="assets/vendor/sodium.js"></script>
          <script>
          window.__vdsSodiumReady.then(function(s){
            document.body.textContent=(typeof s.crypto_box_seal==='function' && typeof s.memzero==='function')?'SODIUM_OK':'SODIUM_BAD';
          }).catch(function(e){document.body.textContent='SODIUM_ERR:'+e.message});
          </script>
          EOF
          python3 -m http.server 8765 --directory /tmp/vds-pages >/tmp/vds-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          "$chrome_bin" --headless --disable-gpu --no-sandbox --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/crypto-smoke.html > /tmp/crypto-smoke.out
          grep -q 'SODIUM_OK' /tmp/crypto-smoke.out

      - name: Verify production discovery workflow unchanged in feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main -- .github/workflows/high-frequency-discovery.yml
          git diff --exit-code origin/main -- .github/workflows/cross-signal-runtime-reconcile.yml
