name: VDS Command Center — QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/vds-command-*'
      - 'fix/command-center-*'
    paths:
      - 'command-center/**'
      - 'api/v1/**'
      - 'project/COMMAND_CENTER_TASK_BRIDGE_PROTOCOL.md'
      - 'scripts/**'
      - '.github/workflows/vds-command-center-*.yml'
      - '.github/workflows/vds-ai-command.yml'

permissions:
  contents: read

concurrency:
  group: vds-command-center-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/build_command_center_api.py scripts/vds_ai_command.py scripts/prepare_command_center_assets.py scripts/overlay_provider_live_dashboard.py scripts/overlay_provider_live_replies.py scripts/update_command_center_health.py
          node --check command-center/assets/app.js
          node --check command-center/assets/sodium-bootstrap.js
          node --check command-center/assets/secure-onboarding.js
          node --check command-center/assets/github-token-helper.js

      - name: Build complete read model and health-v2 regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_command_center_api.py
          python3 scripts/enrich_command_center_funnel.py
          python3 scripts/overlay_provider_live_dashboard.py
          python3 scripts/overlay_provider_live_replies.py
          python3 scripts/update_command_center_health.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('api/v1/health.json').read_text())
          t=json.loads(Path('api/v1/today.json').read_text())
          d=json.loads(Path('api/v1/dashboard.json').read_text())
          assert h['schema_version']=='2.0'
          assert h['outbound_reconciled'] is True
          assert h['inbound_reconciled'] is True
          assert h['outbound_source_fresh'] is True
          assert h['reply_source_fresh'] is True
          assert h['status']=='OK'
          assert isinstance(t['sent_count'], int) and t['sent_count'] >= 0
          assert isinstance(t['first_contact_count'], int) and t['first_contact_count'] >= 0
          assert h.get('outbound_last_event_at')
          assert h.get('reconciled_at')
          assert t['source_health']['outbound_reconciled'] is True
          assert d['source_health']['outbound_reconciled'] is True
          PY

      - name: Current architecture and security invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from scripts.vds_ai_command import fallback_targets
          pending=json.loads(Path('command-center/commands/pending.json').read_text())
          processed=json.loads(Path('command-center/commands/processed.json').read_text())
          router=Path('scripts/vds_ai_command.py').read_text()
          onboarding=Path('command-center/assets/secure-onboarding.js').read_text()
          static=''.join(p.read_text(errors='ignore') for p in Path('command-center').rglob('*') if p.is_file() and p.suffix in {'.html','.js','.css'})
          assert pending['schema_version'] == '1.3'
          assert isinstance(pending['commands'], list)
          assert isinstance(processed['receipts'], list)
          assert fallback_targets('SEND_DIRECTIVE','send_ready_jobs',{}) == ['LINKEDIN_HUNTER']
          assert fallback_targets('SEND_DIRECTIVE','send_ready_commercial',{}) == ['UNIFIED_LOOP']
          assert fallback_targets('SEARCH_DIRECTIVE','agency_white_label',{}) == ['UNIFIED_LOOP']
          assert fallback_targets('SEARCH_DIRECTIVE','direct_job_wordpress',{}) == ['LINKEDIN_HUNTER']
          assert fallback_targets('PRIORITY_DIRECTIVE','prioritize_north_italy',{}) == ['LINKEDIN_HUNTER','UNIFIED_LOOP']
          assert 'WORKERS = {"LINKEDIN_HUNTER", "UNIFIED_LOOP"}' in router
          assert 'normal_cycle_must_continue' in router and 'expires_at' in router
          assert 'crypto_box_seal' in onboarding and 'actions/secrets/public-key' in onboarding
          assert '/actions/secrets/${provider.secret}' in onboarding
          assert 'localStorage' not in static
          assert not re.search(r'sk-[A-Za-z0-9_-]{20,}', static)
          PY

      - name: Test vendored assets
        run: |
          rm -rf /tmp/vds-pages && mkdir -p /tmp/vds-pages
          cp -R command-center/. /tmp/vds-pages/
          python3 scripts/prepare_command_center_assets.py /tmp/vds-pages
          test -s /tmp/vds-pages/assets/fonts/dm-sans.woff2
          test -s /tmp/vds-pages/assets/fonts/material-symbols-rounded.woff2
          test -s /tmp/vds-pages/assets/vendor/chart.umd.min.js
          test -s /tmp/vds-pages/assets/vendor/sodium.js
          ! grep -R -E 'sk-[A-Za-z0-9_-]{20,}' /tmp/vds-pages
          ! grep -R 'localStorage' /tmp/vds-pages/assets/*.js

      - name: Verify production discovery core unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main -- .github/workflows/high-frequency-discovery.yml
          git diff --exit-code origin/main -- .github/workflows/cross-signal-runtime-reconcile.yml
