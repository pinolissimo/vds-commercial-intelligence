name: VDS Command Center — QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/vds-command-*'
      - 'fix/command-center-*'
      - 'fix/provider-*'
    paths:
      - 'command-center/**'
      - 'api/v1/**'
      - 'state/provider-observation.json'
      - 'project/COMMAND_CENTER_TASK_BRIDGE_PROTOCOL.md'
      - 'scripts/**'
      - '.github/workflows/vds-command-center-*.yml'
      - '.github/workflows/vds-ai-command.yml'
permissions:
  contents: read
concurrency:
  group: vds-command-center-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/build_command_center_api.py scripts/vds_ai_command.py scripts/prepare_command_center_assets.py scripts/overlay_provider_live_dashboard.py scripts/overlay_provider_live_replies.py scripts/update_command_center_health.py
          node --check command-center/assets/app.js
          node --check command-center/assets/secure-onboarding.js
      - name: Provider-observed read model regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_command_center_api.py
          python3 scripts/enrich_command_center_funnel.py
          python3 scripts/overlay_provider_live_dashboard.py
          python3 scripts/overlay_provider_live_replies.py
          python3 scripts/update_command_center_health.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('api/v1/health.json').read_text()); t=json.loads(Path('api/v1/today.json').read_text()); d=json.loads(Path('api/v1/dashboard.json').read_text())
          assert h['schema_version']=='2.1'
          assert h['provider_observation_fresh'] is True
          assert h['outbound_reconciled'] is True and h['inbound_reconciled'] is True
          assert h['status']=='OK'
          assert h['latest_provider_sent_uid']>=579
          assert t['sent_count']>=5 and t['first_contact_count']>=5
          assert t['source_health']['provider_observed_at']==h['provider_observed_at']
          assert d['source_health']['provider_observation_fresh'] is True
          PY
      - name: Current architecture and security invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from scripts.vds_ai_command import fallback_targets
          pending=json.loads(Path('command-center/commands/pending.json').read_text()); processed=json.loads(Path('command-center/commands/processed.json').read_text())
          assert pending['schema_version']=='1.3' and isinstance(processed['receipts'],list)
          assert fallback_targets('SEND_DIRECTIVE','send_ready_jobs',{})==['LINKEDIN_HUNTER']
          assert fallback_targets('SEND_DIRECTIVE','send_ready_commercial',{})==['UNIFIED_LOOP']
          first=[Path('command-center/index.html'),Path('command-center/assets/app.js'),Path('command-center/assets/secure-onboarding.js'),Path('command-center/assets/github-token-helper.js')]
          static=''.join(p.read_text(errors='ignore') for p in first)
          assert 'localStorage' not in static and not re.search(r'sk-[A-Za-z0-9_-]{20,}',static)
          PY
      - name: Test vendored assets
        run: |
          rm -rf /tmp/vds-pages && mkdir -p /tmp/vds-pages
          cp -R command-center/. /tmp/vds-pages/
          python3 scripts/prepare_command_center_assets.py /tmp/vds-pages
          test -s /tmp/vds-pages/assets/vendor/chart.umd.min.js
          test -s /tmp/vds-pages/assets/vendor/sodium.js
      - name: Verify production discovery core unchanged
        shell: bash
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- .github/workflows/high-frequency-discovery.yml
          git diff --exit-code origin/main -- .github/workflows/cross-signal-runtime-reconcile.yml
