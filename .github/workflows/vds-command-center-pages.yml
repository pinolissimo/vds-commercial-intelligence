name: VDS Commercial Intelligence — Decommission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vds-command-center-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build decommissioned site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <title>Servizio dismesso</title>
            <style>
              html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#111;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;padding:40px;text-align:center}h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 18px}p{font-size:1.1rem;line-height:1.6;color:#bbb}
            </style>
          </head>
          <body><main><h1>Servizio dismesso</h1><p>Visual Design Studio Commercial Intelligence non è più operativo.</p></main></body>
          </html>
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
