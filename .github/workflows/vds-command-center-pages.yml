name: VDS Command Center — Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/**'
      - '.github/workflows/vds-command-center-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vds-command-center-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload VDS Command Center
        uses: actions/upload-pages-artifact@v3
        with:
          path: command-center

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
