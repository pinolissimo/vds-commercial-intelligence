name: VDS Hourly Revenue Optimizer

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/hourly_performance_tuner.py'
      - 'scripts/search_mission_planner.py'
      - 'scripts/search_source_optimizer.py'
      - 'scripts/snapshot_command_center_fallback.py'
      - 'config/hourly-optimization-runtime.json'
      - 'views/global-contact-ledger.json'
      - '.github/workflows/hourly-revenue-optimizer.yml'

permissions:
  contents: write

concurrency:
  group: vds-hourly-revenue-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile optimizer and safety scripts
        run: |
          python -m py_compile             scripts/hourly_performance_tuner.py             scripts/search_source_optimizer.py             scripts/search_mission_planner.py             scripts/global_contact_ledger.py             scripts/snapshot_command_center_fallback.py

      - name: Rebuild hard dedup ledger and preflight
        run: |
          python scripts/global_contact_ledger.py --build
          python scripts/revenue_flow_preflight.py --repair

      - name: Measure performance and apply bounded optimization
        run: |
          python scripts/search_source_optimizer.py
          python scripts/hourly_performance_tuner.py
          python scripts/search_mission_planner.py

      - name: Rebuild Command Center projections
        run: |
          python scripts/build_command_center_api.py
          python scripts/enrich_command_center_funnel.py
          python scripts/overlay_provider_live_dashboard.py
          python scripts/overlay_provider_live_replies.py
          python scripts/update_command_center_health.py
          python scripts/validate_command_center_invariants.py
          python scripts/snapshot_command_center_fallback.py

      - name: Persist optimizer and last-known-good dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-hourly-optimizer"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"

          rebuild() {
            python scripts/global_contact_ledger.py --build
            python scripts/revenue_flow_preflight.py --repair
            python scripts/search_source_optimizer.py
            python scripts/hourly_performance_tuner.py
            python scripts/search_mission_planner.py
            python scripts/build_command_center_api.py
            python scripts/enrich_command_center_funnel.py
            python scripts/overlay_provider_live_dashboard.py
            python scripts/overlay_provider_live_replies.py
            python scripts/update_command_center_health.py
            python scripts/validate_command_center_invariants.py
            python scripts/snapshot_command_center_fallback.py
          }

          stage() {
            git add               config/adaptive-search-runtime.json               config/hourly-optimization-runtime.json               views/search-source-performance.json               views/hourly-performance.json               views/search-mission-plan.json               views/global-contact-ledger.json               api/v1               command-center/fallback
          }

          stage
          if git diff --cached --quiet; then
            echo "Optimizer state already current"
            exit 0
          fi
          git commit -m "optimizer: hourly performance adjustment and dashboard snapshot"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            rebuild
            stage
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "optimizer: hourly performance adjustment and dashboard snapshot"
            sleep $((attempt * 2))
          done
          exit 1
