name: VDS Public Web Intelligence Booster

on:
  workflow_dispatch:
  schedule:
    - cron: '29 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/public_web_booster.py'
      - 'scripts/booster_seed_bridge.py'
      - 'requirements-search-booster.txt'
      - 'config/public-web-booster.json'
      - '.github/workflows/public-web-booster.yml'

permissions:
  contents: write

concurrency:
  group: vds-public-web-booster
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install public-web crawler
        run: |
          python -m pip install --disable-pip-version-check -r requirements-search-booster.txt
          python -m playwright install --with-deps chromium

      - name: Run compliant public-web booster
        run: |
          python -m py_compile scripts/public_web_booster.py scripts/booster_seed_bridge.py
          python scripts/public_web_booster.py
          python scripts/booster_seed_bridge.py

      - name: Persist booster-owned intelligence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-public-web-booster"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"

          rebuild() {
            python scripts/public_web_booster.py
            python scripts/booster_seed_bridge.py
          }

          stage() {
            git add views/public-web-booster.json views/public-web-qualified-seeds.json
          }

          stage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "booster: refresh public-web commercial intelligence"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            rebuild
            stage
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "booster: refresh public-web commercial intelligence"
            sleep $((attempt * 2))
          done
          exit 1
