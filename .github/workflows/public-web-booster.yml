name: VDS Public Web Intelligence Booster

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/public_web_booster.py'
      - 'scripts/booster_seed_bridge.py'
      - 'scripts/first_party_route_enricher.py'
      - 'scripts/white_label_ready_builder.py'
      - 'scripts/ready_queue_bridge.py'
      - 'requirements-search-booster.txt'
      - 'config/public-web-booster.json'
      - '.github/workflows/public-web-booster.yml'

permissions:
  contents: write

concurrency:
  group: vds-public-web-booster-v2
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install public-web crawler
        run: |
          python -m pip install --disable-pip-version-check scrapy

      - name: Run compliant public-web booster
        run: |
          python -m py_compile scripts/public_web_booster.py scripts/booster_seed_bridge.py scripts/first_party_route_enricher.py scripts/white_label_ready_builder.py scripts/ready_queue_bridge.py
          python scripts/public_web_booster.py
          python scripts/booster_seed_bridge.py &
          p1=$!
          python scripts/first_party_route_enricher.py &
          p2=$!
          wait $p1
          wait $p2
          python scripts/white_label_ready_builder.py
          python scripts/ready_queue_bridge.py

      - name: Persist booster-owned intelligence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-public-web-booster"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"

          snapshot_dir=$(mktemp -d)
          cp views/public-web-booster.json "$snapshot_dir/public-web-booster.json"
          cp views/public-web-qualified-seeds.json "$snapshot_dir/public-web-qualified-seeds.json"
          cp views/public-web-enriched-routes.json "$snapshot_dir/public-web-enriched-routes.json"
          cp views/white-label-ready-to-send.json "$snapshot_dir/white-label-ready-to-send.json"

          restore_booster_outputs() {
            cp "$snapshot_dir/public-web-booster.json" views/public-web-booster.json
            cp "$snapshot_dir/public-web-qualified-seeds.json" views/public-web-qualified-seeds.json
            cp "$snapshot_dir/public-web-enriched-routes.json" views/public-web-enriched-routes.json
            cp "$snapshot_dir/white-label-ready-to-send.json" views/white-label-ready-to-send.json
            python scripts/ready_queue_bridge.py
          }

          stage() {
            git add views/public-web-booster.json views/public-web-qualified-seeds.json views/public-web-enriched-routes.json views/white-label-ready-to-send.json outreach/autonomous-send-queue.jsonl
          }

          stage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "booster: refresh public-web commercial intelligence"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            restore_booster_outputs
            stage
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "booster: refresh public-web commercial intelligence"
            sleep $((attempt * 2))
          done
          exit 1
