name: VDS Command Center — AI Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Natural-language owner command'
        required: true
        type: string
      request_id:
        description: 'Client-generated command correlation id'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'command-center/commands/trigger.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: vds-ai-command
  cancel-in-progress: false

jobs:
  interpret-command:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve owner command
        shell: bash
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            COMMAND="${INPUT_COMMAND}"
            REQUEST_ID="${INPUT_REQUEST_ID}"
          else
            COMMAND="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('command-center/commands/trigger.json').read_text())
          print(str(d.get('command') or '').strip())
          PY
          )"
            REQUEST_ID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('command-center/commands/trigger.json').read_text())
          print(str(d.get('request_id') or '').strip())
          PY
          )"
          fi

          if [ -z "${COMMAND}" ]; then
            echo "Resolved VDS command is empty" >&2
            exit 2
          fi

          {
            echo "VDS_COMMAND<<__VDS_COMMAND__"
            echo "${COMMAND}"
            echo "__VDS_COMMAND__"
            echo "VDS_REQUEST_ID=${REQUEST_ID}"
          } >> "${GITHUB_ENV}"

      - name: Refresh complete read model before interpretation
        run: |
          python3 scripts/build_command_center_api.py
          python3 scripts/enrich_command_center_funnel.py
          python3 scripts/overlay_provider_live_dashboard.py

      - name: Interpret owner command through OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing" >&2
            exit 2
          fi
          python3 scripts/vds_ai_command.py "$VDS_COMMAND"

      - name: Verify provider-live projection invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          madrid = ZoneInfo('Europe/Madrid')
          today = json.loads(Path('api/v1/today.json').read_text())
          live = json.loads(Path('state/provider-outbound-live.json').read_text())
          date_str = today.get('date')
          expected = 0
          for event in live.get('events', []):
              if event.get('state') != 'VERIFIED_EMAIL_SENT' or event.get('count_as_successful_outbound') is False:
                  continue
              sent_at = event.get('sent_at')
              if not sent_at:
                  continue
              dt = datetime.fromisoformat(sent_at.replace('Z', '+00:00'))
              if str(dt.astimezone(madrid).date()) == date_str:
                  expected += 1
          actual = int(today.get('sent_count') or 0)
          if actual < expected:
              raise SystemExit(f'Provider-live invariant failed: today.sent_count={actual}, expected_at_least={expected}')
          print(f'Provider-live invariant OK: today.sent_count={actual}, provider-live={expected}')
          PY

      - name: Commit durable command record only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vds-command-center-bot"
          git config user.email "35764978+pinolissimo@users.noreply.github.com"

          # The refreshed api/v1 read model is disposable and is owned by the
          # projections workflow. Persist only the AI command artifacts here.
          git add api/v1/ai-command/latest.json api/v1/ai-command/history command-center/commands/pending.json || true

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "command-center: record AI owner directive"

          # Discard uncommitted disposable projection changes before rebasing.
          # This prevents concurrent dashboard refreshes from creating conflicts
          # in api/v1/*.json while preserving the durable command commit above.
          git reset --hard HEAD

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another worker; rebasing durable command only (attempt $attempt)"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Durable AI command files conflicted with another writer; refusing to overwrite." >&2
              exit 1
            fi

            sleep $((attempt * 2))
          done

          echo "Unable to publish AI command after 5 race-safe attempts." >&2
          exit 1

      - name: Immediate safe discovery kick for REFRESH health commands
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s api/v1/ai-command/latest.json ]; then
            exit 0
          fi
          CLASS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('api/v1/ai-command/latest.json').read_text())
          print(d.get('command_class',''))
          PY
          )"
          INTENT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('api/v1/ai-command/latest.json').read_text())
          print(d.get('intent',''))
          PY
          )"
          if [ "$CLASS" = "REFRESH" ] && [ "$INTENT" = "verify_and_remediate_operational_blocks" ]; then
            echo "Owner requested operational verification; dispatching existing discovery workflow without changing policy or gates."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/high-frequency-discovery.yml/dispatches" \
              -f ref=main
          else
            echo "No immediate discovery kick required for class=$CLASS intent=$INTENT"
          fi
